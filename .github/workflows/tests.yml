name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tutorial-localization:
    name: Tutorial localization resources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate translated text and native screenshots
        run: |
          python3 scripts/sync-tutorial-localizations.py --check
          python3 scripts/validate-tutorial-screenshots.py
          python3 scripts/validate-app-store-metadata.py
          python3 scripts/sync-fdroid-metadata.py --check

  ios-tests:
    name: iOS archive and Duo tests
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 27.1
        run: sudo xcode-select -switch /Applications/Xcode_27.1.app

      - name: Record toolchain and simulator inventory
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list devices available

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Archive without signing
        working-directory: ios
        run: |
          xcodebuild archive \
            -project SIT.xcodeproj \
            -scheme Ticklr \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Ticklr.xcarchive" \
            CODE_SIGNING_ALLOWED=NO

      - name: Run tests
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project SIT.xcodeproj \
            -scheme Ticklr \
            -collect-test-diagnostics never \
            -destination 'platform=iOS Simulator,OS=27.1,name=iPhone Duo' \
            -only-testing:TicklrTests \
            -only-testing:TicklrUITests/BaselineLaunchUITests \
            -only-testing:TicklrUITests/AdaptiveStateUITests \
            -only-testing:TicklrUITests/ComposeFlowUITests \
            -only-testing:TicklrUITests/ContactTicklesUITests \
            -only-testing:TicklrUITests/GroupsScreenUITests \
            -resultBundlePath TestResults \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild-test.log

      # Keep one simulator runtime active at a time on the hosted runner.
      - name: Verify standard iPhone launch
        working-directory: ios
        run: |
          set -o pipefail
          xcrun simctl shutdown all
          SIMULATOR_ID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"].get("com.apple.CoreSimulator.SimRuntime.iOS-27-0", [])
          matches = [d for d in devices if d.get("isAvailable") and d["name"] == sys.argv[1]]
          if not matches:
              sys.exit("No available iOS 27.0 simulator: " + sys.argv[1])
          print(matches[0]["udid"])
          ' 'iPhone 17')
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcodebuild test \
            -project SIT.xcodeproj \
            -scheme Ticklr \
            -collect-test-diagnostics never \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -only-testing:TicklrUITests/BaselineLaunchUITests \
            -resultBundlePath PhoneBaselineResults \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild-phone-baseline.log
          xcrun simctl shutdown all

      - name: Verify standard iPad launch
        working-directory: ios
        run: |
          set -o pipefail
          SIMULATOR_ID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"].get("com.apple.CoreSimulator.SimRuntime.iOS-27-0", [])
          matches = [d for d in devices if d.get("isAvailable") and d["name"] == sys.argv[1]]
          if not matches:
              sys.exit("No available iOS 27.0 simulator: " + sys.argv[1])
          print(matches[0]["udid"])
          ' 'iPad Pro 11-inch (M5)')
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcodebuild test \
            -project SIT.xcodeproj \
            -scheme Ticklr \
            -collect-test-diagnostics never \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -only-testing:TicklrUITests/BaselineLaunchUITests \
            -resultBundlePath PadBaselineResults \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild-pad-baseline.log
          xcrun simctl shutdown all

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: |
            ios/TestResults.xcresult
            ios/xcodebuild-test.log
            ios/PhoneBaselineResults.xcresult
            ios/PadBaselineResults.xcresult
            ios/xcodebuild-phone-baseline.log
            ios/xcodebuild-pad-baseline.log

  android-tests:
    name: Android Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/libs.versions.toml', 'android/**/*.gradle.kts') }}
          restore-keys: gradle-

      - name: Run tests
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-results
          path: android/app/build/reports/tests/testDebugUnitTest/
