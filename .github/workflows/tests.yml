name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tutorial-localization:
    name: Tutorial localization resources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate translated text and native screenshots
        run: |
          python3 scripts/sync-tutorial-localizations.py --check
          python3 scripts/validate-tutorial-screenshots.py
          python3 scripts/validate-app-store-metadata.py
          python3 scripts/sync-fdroid-metadata.py --check

  ios-tests:
    name: iOS archive and Duo tests
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 27.1
        run: sudo xcode-select -switch /Applications/Xcode_27.1.app

      - name: Record toolchain and simulator inventory
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list devices available

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Archive without signing
        working-directory: ios
        run: |
          xcodebuild archive \
            -project SIT.xcodeproj \
            -scheme Ticklr \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Ticklr.xcarchive" \
            CODE_SIGNING_ALLOWED=NO

      - name: Run tests
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project SIT.xcodeproj \
            -scheme Ticklr \
            -destination 'platform=iOS Simulator,OS=27.1,name=iPhone Duo' \
            -only-testing:TicklrTests \
            -only-testing:TicklrUITests/BaselineLaunchUITests \
            -only-testing:TicklrUITests/ComposeFlowUITests \
            -only-testing:TicklrUITests/ContactTicklesUITests \
            -only-testing:TicklrUITests/GroupsScreenUITests \
            -resultBundlePath TestResults \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild-test.log

      - name: Verify standard iPhone and iPad launches
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project SIT.xcodeproj \
            -scheme Ticklr \
            -destination 'platform=iOS Simulator,OS=27.0,name=iPhone 17' \
            -destination 'platform=iOS Simulator,OS=27.0,name=iPad Pro 11-inch (M5)' \
            -only-testing:TicklrUITests/BaselineLaunchUITests \
            -resultBundlePath BaselineResults \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild-baseline.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: |
            ios/TestResults.xcresult
            ios/xcodebuild-test.log
            ios/BaselineResults.xcresult
            ios/xcodebuild-baseline.log

  android-tests:
    name: Android Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/libs.versions.toml', 'android/**/*.gradle.kts') }}
          restore-keys: gradle-

      - name: Run tests
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-results
          path: android/app/build/reports/tests/testDebugUnitTest/
