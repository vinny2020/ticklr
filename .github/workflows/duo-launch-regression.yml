name: Duo launch regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/duo-launch-regression.yml
      - scripts/ios/prepare-duo-simulator.sh

permissions:
  contents: read

jobs:
  compact-draft:
    name: Duo compact draft (single test)
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode 27.1
        run: sudo xcode-select -switch /Applications/Xcode_27.1.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Run only the failed compact draft test
        working-directory: ios
        run: |
          set -o pipefail
          SIMULATOR_ID=$(bash ../scripts/ios/prepare-duo-simulator.sh 2> >(tee duo-boot.log >&2))
          xcodebuild test \
            -project SIT.xcodeproj \
            -scheme Ticklr \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -collect-test-diagnostics never \
            -parallel-testing-enabled NO \
            -only-testing:TicklrUITests/AdaptiveStateUITests/testCompactTickleDraftSurvivesResize \
            -resultBundlePath DuoLaunchRegression.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee duo-launch-regression.log
      - name: Upload focused test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: duo-launch-regression
          path: |
            ios/DuoLaunchRegression.xcresult
            ios/duo-launch-regression.log
            ios/duo-boot.log
